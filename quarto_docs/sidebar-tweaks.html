<script>
document.addEventListener('DOMContentLoaded', function () {
  const sidebar = document.getElementById('quarto-sidebar');
  if (!sidebar) return;
  const isGitHubPages = window.location.hostname.includes('github.io');
  const items = Array.from(sidebar.querySelectorAll('li.sidebar-item'));
  items.forEach(function (item, i) {
    const link = item.querySelector('a.sidebar-item-text');
    if (!link || link.textContent.trim() !== '(.md version)') return;
    const prevItem = items[i - 1];
    if (!prevItem) return;
    const prevContainer = prevItem.querySelector('.sidebar-item-container');
    if (!prevContainer) return;
    if (isGitHubPages) {
      const match = link.getAttribute('href').match(/skills\/(.+)\.md$/);
      if (match) {
        link.href = 'https://github.com/calvinw/agentic-lca/blob/main/.skillshare/skills/' + match[1] + '/SKILL.md';
      }
    }
    prevContainer.style.display = 'block';
    link.style.display = 'inline';
    link.style.marginLeft = '4px';
    link.style.fontSize = '0.72em';
    link.style.opacity = '0.55';
    link.style.fontWeight = 'normal';
    prevContainer.appendChild(link);
    item.style.display = 'none';
  });
});
</script>
