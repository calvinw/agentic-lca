<script>
document.addEventListener('DOMContentLoaded', function () {
  const sidebar = document.getElementById('quarto-sidebar');
  if (!sidebar) return;
  const items = Array.from(sidebar.querySelectorAll('li.sidebar-item'));
  items.forEach(function (item, i) {
    const rawLink = item.querySelector('a[href*="github.com/calvinw/agentic-lca/blob/main/"]');
    if (!rawLink) return;
    const prevItem = items[i - 1];
    if (!prevItem) return;
    const prevContainer = prevItem.querySelector('.sidebar-item-container');
    if (!prevContainer) return;
    prevContainer.style.display = 'block';
    rawLink.style.display = 'inline';
    rawLink.style.marginLeft = '4px';
    rawLink.style.fontSize = '0.72em';
    rawLink.style.opacity = '0.55';
    rawLink.style.fontWeight = 'normal';
    prevContainer.appendChild(rawLink);
    item.style.display = 'none';
  });
});
</script>
