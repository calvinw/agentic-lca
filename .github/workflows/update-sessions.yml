name: Update sessions.json and plans.json

on:
  push:
    paths:
      - 'skills_sessions/**/*.md'
      - 'plan/PLAN_*.md'
      - 'lca_analysis/**/recipe_card.md'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate sessions.json
        run: python3 skills_sessions/generate_sessions.py

      - name: Regenerate plans.json
        run: python3 plan/generate_plans.py

      - name: Regenerate analyses.json
        run: python3 lca_analysis/generate_analyses.py

      - name: Regenerate _quarto.yml and skills/ copies
        run: python3 generate_quarto_yml.py

      - name: Commit updated manifests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quarto_docs/
          git diff --cached --quiet || git commit -m "chore: regenerate manifests and _quarto.yml"
          git push
