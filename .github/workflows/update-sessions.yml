name: Update sessions.json and plans.json

on:
  push:
    paths:
      - 'skills_sessions/**/*.md'
      - 'plan/PLAN_*.md'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate sessions.json
        run: python3 skills_sessions/generate_sessions.py

      - name: Regenerate plans.json
        run: python3 plan/generate_plans.py

      - name: Commit updated manifests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills_sessions/sessions.json plan/plans.json
          git diff --cached --quiet || git commit -m "chore: regenerate sessions.json and plans.json"
          git push
