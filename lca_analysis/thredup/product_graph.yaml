# ## About this analysis
#
# This is the **base case** in a two-model comparison study. It models the full
# lifecycle of one average new garment purchased in the USA — from raw material
# extraction through to disposal. This represents what is environmentally
# **avoided** when a consumer buys the equivalent garment secondhand from thredUP
# instead of buying new.
#
# Compare this result against `thredup_secondhand.md` to see the savings.
#
# Based on: *Comparative Life Cycle Assessment (LCA) of second-hand vs new
# clothing*, Green Story Inc., prepared for thredUP, May 2019.
#
# ---
#
# ### What "average garment" means
#
# thredUP's inventory covers 22 clothing categories and 26 fiber types. The
# study calculated a weighted average across all of them. An average garment
# weighs approximately **0.4 kg** — heavier than a t-shirt (0.2 kg) but lighter
# than a pair of jeans (0.8 kg). The fiber mix is mostly cotton (~40%), polyester
# (~30%), and a blend of wool, nylon, viscose, and other fibers (~30%).
#
# ---
#
# ### Supply chain and CO₂ by stage
#
# | Stage | Process | CO₂ source | CO₂ per garment |
# |---|---|---|---|
# | P1 | Grow and prepare fiber | Farming machinery, fertilizers, synthetic fiber production from petroleum | 5.5 kg |
# | P2 | Spin, weave, dye, finish | Energy-intensive mills; dyeing uses large amounts of hot water and steam | 5.2 kg |
# | P3 | Cut, sew, and ship | Factory energy; transport by ocean freight and road to store | 3.1 kg |
# | P4 | End of life | Landfill (some methane released) and incineration | 2.0 kg |
# | **Total** | | | **~15.8 kg CO₂** |
#
# The study reports 39.4 kg CO₂ per kilogram of clothing. For a 0.4 kg average
# garment: 39.4 × 0.4 = **15.76 kg CO₂ per garment** — this model matches that.
#
# ---
#
# ### Key assumptions (from the study)
#
# - **Fiber mix:** Weighted average across thredUP's actual inventory composition.
# - **Average garment weight:** ~0.4 kg (weighted across all product categories).
# - **Geography:** US consumer market; global supply chain (clothing mostly
#   manufactured in Asia).
# - **Grid electricity:** Global average carbon intensity used for mill and factory
#   energy calculations.
# - **Consumer use excluded:** Washing and drying by the consumer is excluded from
#   this model to allow a clean comparison with the secondhand pathway.
# - **Study method:** CML 2001 (Global Warming Potential, 100-year horizon).
#   Translated here to TRACI 2.2 for consistency with other analyses in this project.
#
# ---
#
# ### Scenario variants in this folder
#
# | File | What it models |
# |---|---|
# | `product_graph.yaml` | NEW garment — the environmental cost you avoid by buying secondhand |
# | `thredup_secondhand.md` | SECONDHAND garment via thredUP — the actual emissions of buying secondhand |
# | `thredup_renewable_warehouse.md` | Secondhand garment — thredUP warehouse powered by renewable energy |
# | `thredup_highquality.md` | Secondhand garment — premium quality items with 85% of useful life remaining |
# | `thredup_partial_displacement.md` | Secondhand garment — only 50% of buyers truly switch from buying new |
# | `thredup_bestcase.md` | Secondhand garment — renewable warehouse + high quality items combined |

name: thredUP Comparative LCA — New Garment (base case)
goal: >
  Calculate the total CO₂ emitted to make, sell, and dispose of one average
  new garment purchased in the USA — representing the environmental cost that
  is AVOIDED when a consumer buys the same garment secondhand from thredUP
  instead. Based on the Green Story / thredUP Comparative LCA study (2019).

functional_unit:
  description: One average new garment (0.4 kg), cradle to end-of-life disposal
  amount: 1.0
  unit: garment

units:
  garment: One average garment item
  kg:      Mass in kilograms

products:
  - { name: Raw fiber,           unit: kg      }
  - { name: Woven fabric,        unit: kg      }
  - { name: Finished garment,    unit: garment }
  - { name: New garment lifecycle, unit: garment }

elementary_flows:
  emissions:
    - { name: Carbon dioxide, compartment: air, unit: kg }

processes:
  - name: P1 — Grow and prepare fiber
    reference_output: { flow: Raw fiber, amount: 1.0 }
    emissions:
      - { flow: Carbon dioxide, amount: 11.0 }

  - name: P2 — Spin, weave, dye, and finish fabric
    reference_output: { flow: Woven fabric, amount: 1.0 }
    inputs:
      - { flow: Raw fiber, amount: 1.25 }
    emissions:
      - { flow: Carbon dioxide, amount: 13.0 }

  - name: P3 — Cut, sew, and ship garment
    reference_output: { flow: Finished garment, amount: 1.0 }
    inputs:
      - { flow: Woven fabric, amount: 0.4 }
    emissions:
      - { flow: Carbon dioxide, amount: 3.1 }

  - name: P4 — Dispose of garment at end of life
    reference_output: { flow: New garment lifecycle, amount: 1.0 }
    inputs:
      - { flow: Finished garment, amount: 1.0 }
    emissions:
      - { flow: Carbon dioxide, amount: 2.0 }

reference_process: P4 — Dispose of garment at end of life

lcia:
  method_name: "TRACI 2.2"
