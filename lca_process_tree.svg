<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Process B: top left -->
  <rect x="40" y="80" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="130" y="103" text-anchor="middle" font-weight="600" font-size="13" fill="#712B13">Process B</text>
  <text x="130" y="120" text-anchor="middle" font-size="11" fill="#993C1D">4 Flums</text>

  <!-- Process A: bottom left -->
  <rect x="40" y="320" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="130" y="343" text-anchor="middle" font-weight="600" font-size="13" fill="#633806">Process A</text>
  <text x="130" y="360" text-anchor="middle" font-size="11" fill="#854F0B">2 Zings</text>

  <!-- Reference process -->
  <rect x="380" y="188" width="200" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="480" y="211" text-anchor="middle" font-weight="600" font-size="13" fill="#3C3489">Reference process</text>
  <text x="480" y="229" text-anchor="middle" font-size="11" fill="#534AB7">10 Blorps</text>
  <text x="480" y="247" text-anchor="middle" font-size="10" fill="#7F77DD">needs 30 Zings, 100 Flums</text>

  <!-- Functional unit -->
  <rect x="720" y="196" width="160" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="800" y="216" text-anchor="middle" font-weight="600" font-size="13" fill="#085041">10 Blorps</text>
  <text x="800" y="233" text-anchor="middle" font-size="11" fill="#0F6E56">functional unit</text>

  <!-- Product flow B -> Reference -->
  <line x1="220" y1="108" x2="380" y2="216" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="292" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#5F5E5A">? Flums</text>

  <!-- Product flow A -> Reference -->
  <line x1="220" y1="348" x2="380" y2="236" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="292" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#5F5E5A">? Zings</text>

  <!-- Reference -> FU -->
  <line x1="580" y1="224" x2="720" y2="220" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="650" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#5F5E5A">10 Blorps</text>

  <!-- Emissions up from B -->
  <line x1="80" y1="80" x2="80" y2="44" stroke="#C04828" stroke-width="1" marker-end="url(#arr)"/>
  <text x="80" y="24" text-anchor="middle" font-size="11" fill="#C04828">0.2 Smog / Flum</text>
  <text x="80" y="38" text-anchor="middle" font-size="10" fill="#C04828">(to nature)</text>

  <line x1="195" y1="80" x2="195" y2="44" stroke="#C04828" stroke-width="1" marker-end="url(#arr)"/>
  <text x="195" y="24" text-anchor="middle" font-size="11" fill="#C04828">0.5 Haze / Flum</text>
  <text x="195" y="38" text-anchor="middle" font-size="10" fill="#C04828">(to nature)</text>

  <!-- Emission up from A -->
  <line x1="130" y1="320" x2="130" y2="284" stroke="#C04828" stroke-width="1" marker-end="url(#arr)"/>
  <text x="130" y="264" text-anchor="middle" font-size="11" fill="#C04828">0.4 Smog / Zing</text>
  <text x="130" y="278" text-anchor="middle" font-size="10" fill="#C04828">(to nature)</text>

  <!-- Extraction into A from below -->
  <line x1="130" y1="416" x2="130" y2="376" stroke="#1D9E75" stroke-width="1" marker-end="url(#arr)"/>
  <text x="130" y="430" text-anchor="middle" font-size="11" fill="#1D9E75">2.0 Aqua / Zing</text>
  <text x="130" y="444" text-anchor="middle" font-size="10" fill="#1D9E75">(from nature)</text>

  <!-- Emission up from Reference -->
  <line x1="480" y1="188" x2="480" y2="152" stroke="#C04828" stroke-width="1" marker-end="url(#arr)"/>
  <text x="480" y="132" text-anchor="middle" font-size="11" fill="#C04828">0.7 Smog / Blorp</text>
  <text x="480" y="146" text-anchor="middle" font-size="10" fill="#C04828">(to nature)</text>

  <!-- Legend (no directional arrows) -->
  <line x1="620" y1="320" x2="650" y2="320" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="658" y="324" font-size="11" fill="#5F5E5A">product flow</text>

  <line x1="620" y1="342" x2="650" y2="342" stroke="#C04828" stroke-width="1"/>
  <text x="658" y="346" font-size="11" fill="#C04828">emission (to nature)</text>

  <line x1="620" y1="364" x2="650" y2="364" stroke="#1D9E75" stroke-width="1"/>
  <text x="658" y="368" font-size="11" fill="#1D9E75">extraction (from nature)</text>
</svg>
