<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCA — Sessions &amp; Plans</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #f8fafc;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 420px;
      min-width: 180px;
      background: #f1f5f9;
      color: #334155;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    #resize-handle {
      width: 5px;
      cursor: col-resize;
      background: #e2e8f0;
      flex-shrink: 0;
      transition: background 0.1s;
    }

    #resize-handle:hover, #resize-handle.dragging { background: #3b82f6; }

    #sidebar-header {
      padding: 56px 16px 10px;
    }

    #sidebar-header h1 {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
    }

    /* ── Tabs ── */
    #tabs {
      display: flex;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-bottom: 2px solid transparent;
      background: none;
      cursor: pointer;
      color: #64748b;
      transition: color 0.1s;
    }

    .tab-btn:hover { color: #0f172a; }
    .tab-btn.active { color: #0f172a; border-bottom-color: #3b82f6; }

    .tab-panel { display: none; overflow-y: auto; }
    .tab-panel.active { display: block; }

    #sidebar-header p {
      font-size: 12px;
      color: #475569;
      margin-top: 3px;
    }

    .skill-group { margin-bottom: 8px; }

    .skill-group-header {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      padding: 14px 16px 4px 16px;
      white-space: nowrap;
      overflow: hidden;
    }

    .skill-group ul {
      list-style: none;
      padding: 0 0 0 16px;
      margin: 0;
    }

    .skill-group li {
      padding: 1px 0;
    }

    .session-link {
      display: inline;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 700;
      color: #000;
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      text-decoration: underline;
      text-underline-offset: 2px;
      padding: 0;
      line-height: 1.8;
      white-space: nowrap;
    }

    .skill-group li {
      overflow: hidden;
    }

    .session-link:hover { color: #3b82f6; }
    .session-link.active { color: #2563eb; font-weight: 600; }

    .session-meta {
      font-size: 11px;
      color: #64748b;
      margin-left: 6px;
    }

    /* ── Content area ── */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #94a3b8;
      text-align: center;
      gap: 8px;
    }

    #placeholder .big { font-size: 32px; }
    #placeholder .msg { font-size: 15px; }
    #placeholder .sub { font-size: 13px; color: #cbd5e1; }

    #content-inner {
      padding: 32px 32px 80px;
    }

    /* ── Session header card ── */
    .session-header-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
    }

    .session-header-card .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      margin-bottom: 3px;
    }

    .session-header-card .header-meta {
      font-size: 12px;
      color: #64748b;
    }

    .tags { display: flex; gap: 8px; flex-wrap: wrap; }

    .tag {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 3px 11px;
      font-size: 12px;
      color: #475569;
    }

    /* ── Turn bubbles ── */
    .turn {
      margin-bottom: 16px;
      border-radius: 8px;
      padding: 14px 18px;
    }

    .turn-ai {
      background: white;
      border: 1px solid #e2e8f0;
    }

    .turn-student {
      background: white;
      border: 1px solid #e2e8f0;
    }

    .turn-label {
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .turn-ai .turn-label { color: #2563eb; }
    .turn-student .turn-label { color: #64748b; }

    /* ── Markdown content styles ── */
    .turn p {
      font-size: 15px;
      line-height: 1.75;
      color: #1e293b;
      margin-bottom: 12px;
    }

    .turn p:last-child { margin-bottom: 0; }

    .turn strong { color: #0f172a; }

    .turn em { color: #334155; }

    .turn ul, .turn ol {
      padding-left: 22px;
      margin-bottom: 12px;
    }

    .turn li {
      font-size: 15px;
      line-height: 1.75;
      color: #1e293b;
      margin-bottom: 4px;
    }

    .turn code {
      background: rgba(0,0,0,0.05);
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    }

    .turn pre {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 14px 16px;
      overflow-x: auto;
      margin-bottom: 12px;
    }

    .turn pre code { background: none; padding: 0; }

    .turn blockquote {
      border-left: 3px solid #3b82f6;
      padding: 8px 14px;
      background: rgba(59,130,246,0.05);
      border-radius: 0 4px 4px 0;
      margin-bottom: 12px;
    }

    .turn h1, .turn h2, .turn h3, .turn h4 {
      color: #0f172a;
      margin: 12px 0 8px;
      line-height: 1.3;
    }

    .turn h1 { font-size: 20px; }
    .turn h2 { font-size: 17px; }
    .turn h3 { font-size: 15px; }

    .turn hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 12px 0;
    }

    /* Images in sessions */
    .turn img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      margin: 8px 0;
    }

    .turn a { color: #2563eb; text-decoration: underline; text-underline-offset: 2px; }

    /* ── Prose (non-turn) content — headers, etc ── */
    .prose-block {
      margin-bottom: 16px;
    }

    .prose-block p {
      font-size: 15px;
      line-height: 1.75;
      color: #334155;
      margin-bottom: 10px;
    }

    /* ── Plan body (plain markdown prose) ── */
    .plan-body h1, .plan-body h2, .plan-body h3 { color: #0f172a; margin: 20px 0 8px; line-height: 1.3; }
    .plan-body h1 { font-size: 22px; }
    .plan-body h2 { font-size: 17px; }
    .plan-body h3 { font-size: 15px; }
    .plan-body p  { font-size: 15px; line-height: 1.75; color: #1e293b; margin-bottom: 14px; }
    .plan-body ul, .plan-body ol { padding-left: 24px; margin-bottom: 14px; }
    .plan-body li { font-size: 15px; line-height: 1.75; color: #1e293b; margin-bottom: 4px; }
    .plan-body code { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 3px; padding: 1px 5px; font-size: 13px; }
    .plan-body pre  { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 14px 16px; overflow-x: auto; margin-bottom: 14px; }
    .plan-body pre code { background: none; border: none; padding: 0; }
    .plan-body hr { border: none; border-top: 1px solid #e2e8f0; margin: 20px 0; }
    .plan-body strong { color: #0f172a; }
    .plan-body a { color: #2563eb; }

    /* Scrollbar styling */
    #sidebar::-webkit-scrollbar { width: 6px; }
    #sidebar::-webkit-scrollbar-track { background: transparent; }
    #sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    #content::-webkit-scrollbar { width: 6px; }
    #content::-webkit-scrollbar-track { background: transparent; }
    #content::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }

    /* ── Toggle button — always visible ── */
    #menu-btn {
      display: flex;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* ── Collapsed sidebar (desktop) ── */
    #sidebar {
      transition: width 0.2s ease, min-width 0.2s ease;
    }

    #sidebar.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      overflow: hidden;
    }

    #sidebar.collapsed + #resize-handle { display: none; }

    /* ── Overlay — mobile only ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 99;
    }

    /* ── Mobile: sidebar as fixed overlay drawer ── */
    @media (max-width: 700px) {
      #sidebar {
        position: fixed !important;
        top: 0;
        left: 0;
        height: 100%;
        width: 85vw !important;
        max-width: 340px !important;
        min-width: 0 !important;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.2s ease !important;
        box-shadow: 2px 0 12px rgba(0,0,0,0.15);
        overflow-y: auto;
      }

      #sidebar.open { transform: translateX(0) !important; }
      #sidebar.collapsed { transform: translateX(-100%) !important; width: 85vw !important; }
      #overlay.open { display: block; }
      #resize-handle { display: none !important; }
      #content-inner { padding: 56px 16px 60px; }
    }
  </style>
</head>
<body>

<button id="menu-btn" aria-label="Open menu">☰</button>
<div id="overlay"></div>

<nav id="sidebar">
  <div id="sidebar-header">
    <h1>LCA Viewer</h1>
  </div>
  <div id="tabs">
    <button class="tab-btn active" data-tab="session">Sessions</button>
    <button class="tab-btn"        data-tab="plan">Plans</button>
    <button class="tab-btn"        data-tab="analysis">Analyses</button>
  </div>
  <div id="session-list"  class="tab-panel active"></div>
  <div id="plan-list"     class="tab-panel"></div>
  <div id="analysis-list" class="tab-panel"></div>
</nav>

<div id="resize-handle"></div>

<main id="content">
  <div id="placeholder">
    <div class="big">📋</div>
    <div class="msg">Select a session from the left</div>
    <div class="sub">LCA teaching transcripts — rendered from markdown</div>
  </div>
</main>

<script>
  let allSessions = [];
  let allPlans    = [];
  let allAnalyses = [];

  // ── Tab switching ─────────────────────────────────────────────────────────
  document.getElementById('tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab + '-list').classList.add('active');
  });

  // ── Load all data, then build sidebar ─────────────────────────────────────
  async function init() {
    try {
      const res = await fetch('skills_sessions/sessions.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      allSessions = (await res.json()).map(s => ({ ...s, file: 'skills_sessions/' + s.file }));
    } catch (e) {
      document.getElementById('session-list').innerHTML =
        `<p style="color:#ef4444;padding:16px;font-size:13px">Could not load sessions.json: ${e.message}</p>`;
    }
    buildSidebar(allSessions);

    try {
      const res = await fetch('plan/plans.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      allPlans = (await res.json()).map(p => ({ ...p, file: 'plan/' + p.file }));
    } catch (e) {
      document.getElementById('plan-list').innerHTML =
        `<p style="color:#ef4444;padding:16px;font-size:13px">Could not load plans.json: ${e.message}</p>`;
    }
    buildPlansSection(allPlans);

    try {
      const res = await fetch('lca_analysis/analyses.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      allAnalyses = await res.json();
    } catch (e) {
      document.getElementById('analysis-list').innerHTML =
        `<p style="color:#ef4444;padding:16px;font-size:13px">Could not load analyses.json: ${e.message}</p>`;
    }
    buildAnalysesSection(allAnalyses);
  }

  // ── Build sidebar ─────────────────────────────────────────────────────────
  function buildSidebar(sessions) {
    const groups = {};
    sessions.forEach((s, i) => {
      if (!groups[s.skill]) groups[s.skill] = [];
      groups[s.skill].push({ ...s, index: i });
    });

    const list = document.getElementById('session-list');
    Object.entries(groups).forEach(([skill, items]) => {
      const group = document.createElement('div');
      group.className = 'skill-group';

      const header = document.createElement('div');
      header.className = 'skill-group-header';
      header.textContent = skill;
      group.appendChild(header);

      const ul = document.createElement('ul');
      items.forEach(s => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.className = 'session-link';
        const stem = s.file.replace(/^.*\//, '').replace(/\.md$/, '');
        const skillSlug = s.file.split('/')[0];
        btn.textContent = stem.startsWith(skillSlug + '-') ? stem.slice(skillSlug.length + 1) : stem;
        btn.addEventListener('click', () => loadSession(s.index, btn));
        li.appendChild(btn);

        ul.appendChild(li);
      });
      group.appendChild(ul);

      list.appendChild(group);
    });
  }

  // ── Build plans section ───────────────────────────────────────────────────
  function buildPlansSection(plans) {
    if (!plans.length) return;
    const list = document.getElementById('plan-list');

    const header = document.createElement('div');
    header.className = 'skill-group-header';
    header.style.borderTop = '1px solid #e2e8f0';
    header.style.marginTop = '8px';
    header.style.paddingTop = '16px';
    header.textContent = 'Plans';
    list.appendChild(header);

    const ul = document.createElement('ul');
    ul.style.listStyle = 'none';
    ul.style.padding = '0 0 0 16px';
    ul.style.margin = '0';

    plans.forEach((p, i) => {
      const li = document.createElement('li');
      li.style.overflow = 'hidden';
      const btn = document.createElement('button');
      btn.className = 'session-link';
      btn.style.whiteSpace = 'nowrap';
      btn.style.fontFamily = 'inherit';
      btn.textContent = p.title;
      btn.addEventListener('click', () => loadPlan(i, btn));
      li.appendChild(btn);
      ul.appendChild(li);
    });
    list.appendChild(ul);
  }

  // ── Load and render a plan (plain markdown) ───────────────────────────────
  async function loadPlan(index, btn) {
    if (activeBtn) activeBtn.classList.remove('active');
    btn.classList.add('active');
    activeBtn = btn;

    const plan = allPlans[index];
    const content = document.getElementById('content');
    content.innerHTML = '<div id="content-inner"><p style="color:#94a3b8;padding:40px 0">Loading…</p></div>';

    let text;
    try {
      const res = await fetch(plan.file);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      text = await res.text();
    } catch (e) {
      content.innerHTML = `<div id="content-inner"><p style="color:#ef4444">Could not load ${plan.file}<br>${e.message}</p></div>`;
      return;
    }

    const html = marked.parse(text);
    content.innerHTML = `<div id="content-inner"><div class="plan-body">${html}</div></div>`;
    content.scrollTop = 0;
  }

  // ── Build analyses section ────────────────────────────────────────────────
  function buildAnalysesSection(analyses) {
    if (!analyses.length) return;
    const list = document.getElementById('analysis-list');

    // Group by top-level folder (e.g. levis vs everything else)
    const groups = {};
    analyses.forEach((a, i) => {
      const parts = a.folder.split('/');  // lca_analysis / [group] / name
      const group = parts.length > 2 ? parts[1] : '';
      if (!groups[group]) groups[group] = [];
      groups[group].push({ ...a, index: i });
    });

    Object.entries(groups).forEach(([group, items]) => {
      if (group) {
        const hdr = document.createElement('div');
        hdr.className = 'skill-group-header';
        hdr.textContent = group.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        list.appendChild(hdr);
      }
      const ul = document.createElement('ul');
      ul.style.cssText = 'list-style:none;padding:0 0 0 16px;margin:0;';
      items.forEach(a => {
        const li = document.createElement('li');
        li.style.overflow = 'hidden';
        const btn = document.createElement('button');
        btn.className = 'session-link';
        btn.style.whiteSpace = 'nowrap';
        btn.style.fontFamily = 'inherit';
        btn.textContent = a.name;
        btn.addEventListener('click', () => loadAnalysis(a.index, btn));
        li.appendChild(btn);
        ul.appendChild(li);
      });
      list.appendChild(ul);
    });
  }

  // ── Load and render an analysis (recipe + results) ────────────────────────
  async function loadAnalysis(index, btn) {
    if (activeBtn) activeBtn.classList.remove('active');
    btn.classList.add('active');
    activeBtn = btn;

    const a = allAnalyses[index];
    const content = document.getElementById('content');
    content.innerHTML = '<div id="content-inner"><p style="color:#94a3b8;padding:40px 0">Loading…</p></div>';

    async function fetchMd(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.text();
    }

    try {
      let html = '';
      const recipe = await fetchMd(a.recipe);
      html += `<div class="plan-body">${marked.parse(recipe)}</div>`;
      if (a.results) {
        const results = await fetchMd(a.results);
        html += `<hr style="border:none;border-top:1px solid #e2e8f0;margin:32px 0">`;
        html += `<div class="plan-body">${marked.parse(results)}</div>`;
      }
      content.innerHTML = `<div id="content-inner">${html}</div>`;
    } catch (e) {
      content.innerHTML = `<div id="content-inner"><p style="color:#ef4444">Could not load ${a.name}: ${e.message}</p></div>`;
    }
    content.scrollTop = 0;
  }

  // ── Load and render a session ─────────────────────────────────────────────
  let activeBtn = null;

  async function loadSession(index, btn) {
    if (activeBtn) activeBtn.classList.remove('active');
    btn.classList.add('active');
    activeBtn = btn;

    const session = allSessions[index];
    const content = document.getElementById('content');
    content.innerHTML = '<div id="content-inner"><p style="color:#94a3b8;padding:40px 0">Loading…</p></div>';

    let text;
    try {
      const res = await fetch(session.file);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      text = await res.text();
    } catch (e) {
      content.innerHTML = `<div id="content-inner"><p style="color:#ef4444">Could not load file: ${session.file}<br>${e.message}</p></div>`;
      return;
    }

    // Strip the YAML-like header block (lines 1–6 up to the first ---)
    // and render the conversation
    const rendered = renderSession(session, text);
    content.innerHTML = `<div id="content-inner">${rendered}</div>`;
    content.scrollTop = 0;
  }

  // ── Render markdown into styled turn bubbles ──────────────────────────────
  function renderSession(session, raw) {
    // Build two-line header
    const header = `
      <div class="session-header-card">
        <div class="header-title">${session.command}</div>
        <div class="header-meta">${session.student} · v${session.version} · ${session.model} · session ${session.n}</div>
      </div>`;

    // Split markdown into speaker turns
    // Turns start with **AI:** or **Student:** at the beginning of a line
    const lines = raw.split('\n');
    const turns = [];
    let currentSpeaker = null;
    let currentLines = [];

    // Skip the frontmatter header block — find the first --- separator and start after it
    let bodyStart = 0;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].trim() === '---') {
        bodyStart = i + 1;
        break;
      }
    }

    for (let i = bodyStart; i < lines.length; i++) {
      const line = lines[i];
      const aiMatch = line.match(/^\*\*AI:\*\*/);
      const studentMatch = line.match(/^\*\*Student:\*\*/);

      if (aiMatch || studentMatch) {
        if (currentSpeaker !== null && currentLines.length > 0) {
          turns.push({ speaker: currentSpeaker, text: currentLines.join('\n') });
        }
        currentSpeaker = aiMatch ? 'AI' : 'Student';
        // Keep rest of the line after the label
        const rest = line.replace(/^\*\*(AI|Student):\*\*\s?/, '');
        currentLines = rest ? [rest] : [];
      } else {
        if (currentSpeaker !== null) {
          currentLines.push(line);
        }
        // Lines before first speaker are ignored (already handled by bodyStart)
      }
    }

    // Push final turn
    if (currentSpeaker !== null && currentLines.length > 0) {
      turns.push({ speaker: currentSpeaker, text: currentLines.join('\n') });
    }

    // Render each turn
    const turnsHtml = turns.map(t => {
      const cls = t.speaker === 'AI' ? 'turn-ai' : 'turn-student';
      const html = marked.parse(t.text.trim());
      return `<div class="turn ${cls}"><div class="turn-label">${t.speaker}</div>${html}</div>`;
    }).join('\n');

    return header + turnsHtml;
  }

  // ── Sidebar toggle (works at all sizes) ──────────────────────────────────
  const menuBtn   = document.getElementById('menu-btn');
  const overlay   = document.getElementById('overlay');
  const sidebarEl = document.getElementById('sidebar');

  function isMobile() { return window.innerWidth <= 700; }

  function openSidebar() {
    if (isMobile()) {
      sidebarEl.classList.add('open');
      sidebarEl.classList.remove('collapsed');
      overlay.classList.add('open');
    } else {
      sidebarEl.classList.remove('collapsed');
    }
  }

  function closeSidebar() {
    if (isMobile()) {
      sidebarEl.classList.remove('open');
      overlay.classList.remove('open');
    } else {
      sidebarEl.classList.add('collapsed');
    }
  }

  function toggleSidebar() {
    const isOpen = isMobile()
      ? sidebarEl.classList.contains('open')
      : !sidebarEl.classList.contains('collapsed');
    isOpen ? closeSidebar() : openSidebar();
  }

  menuBtn.addEventListener('click', toggleSidebar);
  overlay.addEventListener('click', closeSidebar);

  // ── Resizable sidebar ─────────────────────────────────────────────────────
  const handle  = document.getElementById('resize-handle');
  const sidebar = document.getElementById('sidebar');

  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    handle.classList.add('dragging');
    const startX = e.clientX;
    const startW = sidebar.offsetWidth;

    function onMove(e) {
      const w = Math.max(180, startW + e.clientX - startX);
      sidebar.style.width = w + 'px';
    }
    function onUp() {
      handle.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
