site_name: LCA Learning Hub
site_description: LCA skills sessions, plans, analyses, and exercises for FIT students
docs_dir: docs

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

exclude_docs: |
  *.py
  *.json
  *.html
  *.sh
  *.xlsx
  .DS_Store
