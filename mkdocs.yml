site_name: LCA Learning Hub
site_description: LCA skills sessions and project plans for FIT students
docs_dir: docs

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

exclude_docs: |
  *.py
  *.json
  *.html
  *.sh
  *.xlsx
  *.svg
  .DS_Store
  BLEND_ALLOCATION_FRAMEWORK.md
  BLEND_REFERENCES.md
  lca_blorp_example.md
  LCACoffeeExlainer.md
  lca_electricity_example.md
  LCA_Popcorn_vs_Polystyrene.md
  exercises/**
