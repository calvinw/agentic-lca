site_name: LCA Learning Hub
site_description: LCA skills sessions and project plans for FIT students
docs_dir: docs

nav:
  - Home: index.md
  - Sessions: sessions/
  - Plans: plans/

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

exclude_docs: |
  *.py
  *.json
  *.html
  *.sh
  *.xlsx
  .DS_Store
